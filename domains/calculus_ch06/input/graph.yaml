domain: calculus_ch06
primitives:
  definite_integral:
    defines: The limit of a Riemann sum used to compute quantities such as area, volume, and other accumulated
      quantities over an interval.
    tier: 0
  solid_of_revolution:
    defines: A three-dimensional solid formed by revolving a plane region around a line (the axis of revolution).
    tier: 0
  linear_density:
    defines: A function describing how mass is distributed per unit length along a one-dimensional object
      such as a rod.
    tier: 0
  hookes_law:
    defines: The principle that the force required to stretch or compress a spring from equilibrium is
      proportional to the displacement, F(x) = kx.
    tier: 0
  center_of_mass_point_masses:
    defines: The balance point of a system of point masses, computed as the total moment divided by the
      total mass.
    tier: 0
  moment:
    defines: A measure of the tendency of a mass distribution to rotate about an axis, computed as mass
      times distance from that axis.
    tier: 0
  natural_logarithm_integral_def:
    defines: The natural logarithm of x defined as the definite integral from 1 to x of 1/t dt.
    tier: 0
  hyperbolic_functions:
    defines: Functions such as sinh x and cosh x defined in terms of exponential functions, analogous
      to trigonometric functions.
    tier: 0
concepts:
  area_between_curves:
    defines: The area of a region bounded by two curves, found by integrating the difference of the functions
      over an interval.
    composed_of:
    - definite_integral
    tier: 1
  volume_slicing_method:
    defines: A technique for finding the volume of a solid by integrating the cross-sectional area function
      over an interval.
    composed_of:
    - definite_integral
    tier: 1
  disk_method:
    defines: A special case of the slicing method for solids of revolution in which cross-sections are
      circular disks, giving volume as the integral of pi times the square of the radius function.
    composed_of:
    - volume_slicing_method
    - solid_of_revolution
    tier: 2
  washer_method:
    defines: A method for finding the volume of a solid of revolution with a cavity, where cross-sections
      are washers (annuli) formed by subtracting the area of an inner circle from an outer circle.
    composed_of:
    - disk_method
    tier: 3
  cylindrical_shell_method:
    defines: A technique for finding the volume of a solid of revolution by integrating the surface area
      of nested cylindrical shells, integrating along the axis perpendicular to the axis of revolution.
    composed_of:
    - solid_of_revolution
    - definite_integral
    tier: 1
  arc_length:
    defines: The length of a curve between two points, computed by integrating the square root of one
      plus the square of the derivative.
    composed_of:
    - definite_integral
    tier: 1
  surface_area_of_revolution:
    defines: The total area of the surface generated by revolving a curve around an axis, found by integrating
      2*pi times the function times the arc length element.
    composed_of:
    - arc_length
    - solid_of_revolution
    tier: 2
  mass_from_density:
    defines: The mass of a one- or two-dimensional object found by integrating its linear or radial density
      function over its extent.
    composed_of:
    - linear_density
    - definite_integral
    tier: 1
  work_variable_force:
    defines: The energy expended moving an object along a line under a variable force, computed as the
      integral of the force function over distance.
    composed_of:
    - definite_integral
    tier: 1
  work_pumping_liquid:
    defines: The work required to move a liquid from one height to another, found by integrating the weight
      of thin horizontal layers times the distance each must be lifted.
    composed_of:
    - definite_integral
    tier: 1
  hydrostatic_force:
    defines: The total force exerted by a fluid on a submerged vertical surface, found by integrating
      pressure (weight-density times depth) times width over depth.
    composed_of:
    - definite_integral
    tier: 1
  centroid_lamina:
    defines: The geometric center of mass of a thin, flat plate (lamina) of constant density, found using
      integrals of the region's moments and area.
    composed_of:
    - moment
    - center_of_mass_point_masses
    - area_between_curves
    tier: 2
  symmetry_principle:
    defines: The principle that if a region is symmetric about a line, its centroid lies on that line.
    composed_of:
    - centroid_lamina
    tier: 3
  theorem_of_pappus:
    defines: The theorem that the volume of a solid of revolution equals the area of the revolved region
      multiplied by the distance traveled by its centroid.
    composed_of:
    - centroid_lamina
    - solid_of_revolution
    tier: 3
  number_e:
    defines: The unique real number for which the natural logarithm equals 1, used as the base of the
      natural exponential function.
    composed_of:
    - natural_logarithm_integral_def
    tier: 1
  exponential_function_def:
    defines: The function e^x defined as the inverse of the natural logarithm, extending exponentiation
      to all real exponents.
    composed_of:
    - natural_logarithm_integral_def
    tier: 1
  general_exponential_logarithm:
    defines: Exponential functions a^x and logarithms base a defined in terms of e^x and the natural logarithm
      for any positive base a.
    composed_of:
    - exponential_function_def
    - natural_logarithm_integral_def
    tier: 2
  doubling_time_half_life:
    defines: The constant time required for an exponentially growing quantity to double, or for an exponentially
      decaying quantity to reduce by half, given by (ln 2)/k.
    composed_of:
    - exponential_function_def
    tier: 2
  hyperbolic_derivatives_integrals:
    defines: Differentiation and integration rules for hyperbolic functions derived from their exponential
      definitions.
    composed_of:
    - hyperbolic_functions
    - exponential_function_def
    tier: 2
  inverse_hyperbolic_functions:
    defines: The inverse functions of the hyperbolic functions, along with their derivative and integral
      formulas obtained via implicit differentiation.
    composed_of:
    - hyperbolic_derivatives_integrals
    tier: 3
applications:
  exponential_growth_model:
    defines: A model y = y0 e^(kt) describing systems, such as populations or investments, whose rate
      of growth is proportional to their current value.
    needs:
    - exponential_function_def
    tier: 2
  exponential_decay_model:
    defines: A model y = y0 e^(-kt) describing systems, such as radioactive substances or cooling objects,
      that decrease at a rate proportional to their current value.
    needs:
    - exponential_function_def
    tier: 2
  newtons_law_of_cooling:
    defines: The principle that an object's temperature changes at a rate proportional to the difference
      between its temperature and the ambient temperature, modeled with exponential decay.
    needs:
    - exponential_decay_model
    tier: 3
  catenary:
    defines: The curve, of the form y = a cosh(x/a), formed by a cable or chain hanging under its own
      weight between two supports.
    needs:
    - hyperbolic_functions
    tier: 1
