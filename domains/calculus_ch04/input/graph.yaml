domain: calculus_ch04
primitives:
  derivative:
    defines: The instantaneous rate of change of a function with respect to its independent variable.
    tier: 0
  chain_rule:
    defines: A differentiation rule for computing the derivative of a composite function.
    tier: 0
  tangent_line:
    defines: The line through a point on a curve whose slope equals the derivative of the function at
      that point.
    tier: 0
  absolute_extrema:
    defines: The largest or smallest value a function attains over its domain or a given interval.
    tier: 0
  limits_at_infinity:
    defines: The value a function approaches as its input grows arbitrarily large in the positive or negative
      direction.
    tier: 0
  iterative_process:
    defines: A sequence generated by repeatedly applying the same function to the previous term.
    tier: 0
concepts:
  related_rates:
    defines: A technique for finding the rate of change of one quantity by relating it, via the chain
      rule, to another quantity's rate of change.
    composed_of:
    - derivative
    - chain_rule
    tier: 1
  linear_approximation:
    defines: Using the tangent line to approximate a function's values near a point.
    composed_of:
    - tangent_line
    tier: 1
  differentials:
    defines: The quantities dx and dy = f'(x)dx that approximate actual change in a function's output.
    composed_of:
    - derivative
    tier: 1
  extreme_value_theorem:
    defines: A continuous function on a closed, bounded interval attains both an absolute maximum and
      minimum.
    composed_of:
    - absolute_extrema
    tier: 1
  local_extrema:
    defines: A local maximum or minimum, where a function's value exceeds or is exceeded by all nearby
      values.
    composed_of:
    - absolute_extrema
    tier: 1
  critical_point:
    defines: An interior point where the derivative is zero or undefined; the only candidates for local
      extrema.
    composed_of:
    - derivative
    tier: 1
  concavity:
    defines: Whether a function's graph curves upward or downward, determined by the sign of the second
      derivative.
    composed_of:
    - derivative
    tier: 1
  horizontal_asymptote:
    defines: A horizontal line that a function's graph approaches as x approaches infinity or negative
      infinity.
    composed_of:
    - limits_at_infinity
    tier: 1
  infinite_limit_at_infinity:
    defines: The behavior of a function whose values grow arbitrarily large as the input approaches infinity.
    composed_of:
    - limits_at_infinity
    tier: 1
  end_behavior:
    defines: The behavior of a function's graph as x approaches positive or negative infinity.
    composed_of:
    - limits_at_infinity
    tier: 1
  indeterminate_forms:
    defines: Expressions such as 0/0 or infinity/infinity that require further analysis to resolve limits.
    composed_of:
    - limits_at_infinity
    tier: 1
  antiderivative:
    defines: A function F whose derivative equals a given function f.
    composed_of:
    - derivative
    tier: 1
  newtons_method:
    defines: An iterative technique for approximating roots using tangent lines.
    composed_of:
    - tangent_line
    - iterative_process
    tier: 1
  fermats_theorem:
    defines: If a differentiable function has a local extremum at c, then f'(c) = 0.
    composed_of:
    - local_extrema
    - critical_point
    tier: 2
  second_derivative_test:
    defines: Classifying a critical point as a local max or min based on the sign of the second derivative.
    composed_of:
    - critical_point
    - concavity
    tier: 2
  oblique_asymptote:
    defines: A non-horizontal line that a rational function's graph approaches as x approaches infinity.
    composed_of:
    - limits_at_infinity
    - end_behavior
    tier: 2
  lhopitals_rule:
    defines: For indeterminate forms 0/0 or infinity/infinity, the limit of a quotient equals the limit
      of the quotient of derivatives.
    composed_of:
    - indeterminate_forms
    - derivative
    tier: 2
  indefinite_integral:
    defines: The notation representing the most general antiderivative of a function.
    composed_of:
    - antiderivative
    tier: 2
  power_rule_integrals:
    defines: The rule for integrating x^n, derived from the power rule for derivatives.
    composed_of:
    - antiderivative
    tier: 2
  rolles_theorem:
    defines: If f is continuous on [a,b], differentiable on (a,b), and f(a) = f(b), there exists c where
      f'(c) = 0.
    composed_of:
    - fermats_theorem
    - extreme_value_theorem
    tier: 3
  mean_value_theorem:
    defines: There exists a point where the instantaneous rate of change equals the average rate of change
      over an interval.
    composed_of:
    - rolles_theorem
    tier: 4
  mvt_corollaries:
    defines: Results from the Mean Value Theorem relating a function's derivative to its monotonicity
      and constancy.
    composed_of:
    - mean_value_theorem
    tier: 5
  first_derivative_test:
    defines: Classifying a critical point using the sign change of the first derivative around it.
    composed_of:
    - critical_point
    - mvt_corollaries
    tier: 6
applications:
  propagated_error:
    defines: The error in a computed quantity resulting from a measurement error, estimated using differentials.
    needs:
    - differentials
    tier: 2
  locating_absolute_extrema:
    defines: A procedure for finding absolute extrema on a closed interval by comparing values at critical
      points and endpoints.
    needs:
    - critical_point
    - extreme_value_theorem
    - fermats_theorem
    tier: 3
  growth_rates:
    defines: A classification of how quickly functions grow relative to one another, determined using
      L'Hopital's rule.
    needs:
    - lhopitals_rule
    tier: 3
  initial_value_problem:
    defines: The problem of finding a function satisfying a differential equation and a specified initial
      condition.
    needs:
    - antiderivative
    - indefinite_integral
    tier: 3
  applied_optimization:
    defines: Real-world problems solved by expressing a quantity to be maximized or minimized as a function
      and finding its extrema.
    needs:
    - locating_absolute_extrema
    tier: 4
  curve_sketching:
    defines: A systematic procedure using limits, asymptotes, and derivatives to produce an accurate graph
      of a function.
    needs:
    - first_derivative_test
    - second_derivative_test
    - concavity
    - horizontal_asymptote
    - oblique_asymptote
    - end_behavior
    tier: 7
