# Book-level super-graph — AUTO-GENERATED, do not edit by hand.
# Run:  python scripts/build_super_graph.py
#
# Merges all chapter graphs; each node carries source_domain (canonical
# definition) and optionally also_in (other chapters that reuse it).
# Cross-domain primitives (concepts in an earlier chapter re-declared as
# primitives in a later one) appear here with their full composed_of chain.
# This file is never used for SPL generation — it exists for validation
# and future book-level graph visualisation.
domain: calculus
chapters:
- calculus_ch01
- calculus_ch02
- calculus_ch03
- calculus_ch04
- calculus_ch05
- calculus_ch06
primitives:
  relation:
    defines: A set of ordered pairs (x, y) that defines a relationship between two
      sets A and B.
    tier: 0
    source_domain: calculus_ch01
  slope:
    defines: The ratio of change in y to change in x, (y2-y1)/(x2-x1), measuring the
      steepness and direction of a line.
    tier: 0
    source_domain: calculus_ch01
  power_function:
    defines: A function of the form f(x) = a x^b for real numbers a and b.
    tier: 0
    source_domain: calculus_ch01
  transcendental_function:
    defines: A function, such as trigonometric, exponential, or logarithmic functions,
      that cannot be expressed using basic algebraic operations alone.
    tier: 0
    source_domain: calculus_ch01
  radian_measure:
    defines: A measure of angle defined so that the angle corresponding to an arc
      of length 1 on the unit circle has radian measure 1.
    tier: 0
    source_domain: calculus_ch01
  rate_of_change:
    defines: A measure of how a function's output changes relative to its input, given
      for linear functions by the slope.
    tier: 0
    source_domain: calculus_ch02
  limit:
    defines: The real number L that the values of f(x) approach as x approaches a,
      provided such a value exists.
    tier: 0
    source_domain: calculus_ch02
    also_in:
    - calculus_ch03
  continuity:
    defines: A function is continuous at a point if its limit there equals its function
      value; assumed as background knowledge used to relate differentiability to continuity.
    tier: 0
    source_domain: calculus_ch03
  difference_quotient:
    defines: The ratio (f(x) − f(a))/(x − a), or equivalently (f(a+h) − f(a))/h, used
      to measure average rate of change over an interval.
    tier: 0
    source_domain: calculus_ch03
  absolute_extrema:
    defines: The largest or smallest value a function attains over its domain or a
      given interval.
    tier: 0
    source_domain: calculus_ch04
  limits_at_infinity:
    defines: The value a function approaches as its input grows arbitrarily large
      in the positive or negative direction.
    tier: 0
    source_domain: calculus_ch04
  iterative_process:
    defines: A sequence generated by repeatedly applying the same function to the
      previous term.
    tier: 0
    source_domain: calculus_ch04
  sigma_notation:
    defines: A compact notation using the Greek letter sigma to express the sum of
      a sequence of terms indexed by a dummy variable.
    tier: 0
    source_domain: calculus_ch05
  partition:
    defines: A set of points dividing a closed interval [a, b] into subintervals;
      a regular partition has subintervals of equal width.
    tier: 0
    source_domain: calculus_ch05
  solid_of_revolution:
    defines: A three-dimensional solid formed by revolving a plane region around a
      line (the axis of revolution).
    tier: 0
    source_domain: calculus_ch06
  linear_density:
    defines: A function describing how mass is distributed per unit length along a
      one-dimensional object such as a rod.
    tier: 0
    source_domain: calculus_ch06
  hookes_law:
    defines: The principle that the force required to stretch or compress a spring
      from equilibrium is proportional to the displacement, F(x) = kx.
    tier: 0
    source_domain: calculus_ch06
  center_of_mass_point_masses:
    defines: The balance point of a system of point masses, computed as the total
      moment divided by the total mass.
    tier: 0
    source_domain: calculus_ch06
  moment:
    defines: A measure of the tendency of a mass distribution to rotate about an axis,
      computed as mass times distance from that axis.
    tier: 0
    source_domain: calculus_ch06
  natural_logarithm_integral_def:
    defines: The natural logarithm of x defined as the definite integral from 1 to
      x of 1/t dt.
    tier: 0
    source_domain: calculus_ch06
concepts:
  function:
    defines: A rule that assigns each element of an input set (domain) to exactly
      one element of an output set (range).
    composed_of:
    - relation
    tier: 1
    source_domain: calculus_ch01
  root_function:
    defines: A power function of the form f(x) = x^(1/n) for a positive integer n
      greater than one.
    composed_of:
    - power_function
    tier: 1
    source_domain: calculus_ch01
  domain_range:
    defines: The domain is the set of inputs of a function and the range is the set
      of outputs.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  independent_dependent_variable:
    defines: In y = f(x), x is the independent variable (input) and y is the dependent
      variable (output determined by x).
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  graph_of_function:
    defines: The set of all points (x, f(x)) plotted in the coordinate plane for x
      in the domain of f.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  combining_functions:
    defines: New functions formed from two functions f and g via sum, difference,
      product, or quotient.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  function_composition:
    defines: A new function g∘f formed by applying f to x and then applying g to the
      result, written (g∘f)(x) = g(f(x)).
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  piecewise_defined_function:
    defines: A function defined by different formulas on different parts of its domain.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  linear_function:
    defines: A function of the form f(x) = ax + b, whose graph is a line with slope
      a and y-intercept (0, b).
    composed_of:
    - slope
    - function
    tier: 2
    source_domain: calculus_ch01
  polynomial_function:
    defines: A function of the form f(x) = a_n x^n + ... + a_1 x + a_0 for a nonnegative
      integer n, whose degree is n.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  trigonometric_functions:
    defines: The six functions sin, cos, tan, cot, sec, and csc, defined via the coordinates
      of a point on the unit circle corresponding to an angle θ.
    composed_of:
    - radian_measure
    - function
    tier: 2
    source_domain: calculus_ch01
  one_to_one_function:
    defines: A function f such that f(x1) ≠ f(x2) whenever x1 ≠ x2, so each output
      corresponds to exactly one input.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  exponential_function:
    defines: A function of the form f(x) = b^x for a constant base b > 0, b ≠ 1, with
      a variable exponent.
    composed_of:
    - function
    tier: 2
    source_domain: calculus_ch01
  vertical_line_test:
    defines: A set of plotted points represents a function if and only if every vertical
      line intersects the graph at most once.
    composed_of:
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  zeros_of_function:
    defines: The values of x for which f(x) = 0, corresponding to where the graph
      intersects the x-axis.
    composed_of:
    - function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  y_intercept:
    defines: The point (0, f(0)) where the graph of a function crosses the y-axis,
      if it exists.
    composed_of:
    - function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  increasing_decreasing_function:
    defines: A function is increasing on an interval if outputs never decrease as
      inputs increase, and decreasing if outputs never increase as inputs increase.
    composed_of:
    - function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  even_odd_function:
    defines: A function is even if f(-x) = f(x) and odd if f(-x) = -f(x).
    composed_of:
    - function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  absolute_value_function:
    defines: The piecewise function f(x) = -x for x < 0 and f(x) = x for x ≥ 0, which
      is even and always nonnegative.
    composed_of:
    - piecewise_defined_function
    tier: 3
    source_domain: calculus_ch01
  linear_equation_forms:
    defines: 'Different algebraic forms for describing a line: point-slope, slope-intercept,
      and standard.'
    composed_of:
    - linear_function
    - slope
    tier: 3
    source_domain: calculus_ch01
  quadratic_function:
    defines: A degree-2 polynomial function of the form f(x) = ax^2 + bx + c, whose
      graph is a parabola.
    composed_of:
    - polynomial_function
    tier: 3
    source_domain: calculus_ch01
  cubic_function:
    defines: A degree-3 polynomial function of the form f(x) = ax^3 + bx^2 + cx +
      d.
    composed_of:
    - polynomial_function
    tier: 3
    source_domain: calculus_ch01
  end_behavior:
    defines: The behavior of f(x) as x approaches positive or negative infinity, determined
      for polynomials by the leading term.
    composed_of:
    - polynomial_function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
    also_in:
    - calculus_ch04
  rational_function:
    defines: A function of the form f(x) = p(x)/q(x), where p and q are polynomials.
    composed_of:
    - polynomial_function
    tier: 3
    source_domain: calculus_ch01
  function_transformations:
    defines: Shifts, vertical/horizontal scalings, and reflections applied to the
      graph of a function.
    composed_of:
    - function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  trigonometric_identities:
    defines: Equations involving trigonometric functions, true for all angles where
      defined.
    composed_of:
    - trigonometric_functions
    tier: 3
    source_domain: calculus_ch01
  period_of_function:
    defines: The smallest positive value p such that f(x+p) = f(x) for all x, describing
      the repeating pattern of periodic functions.
    composed_of:
    - trigonometric_functions
    tier: 3
    source_domain: calculus_ch01
  horizontal_line_test:
    defines: A function is one-to-one if and only if every horizontal line intersects
      its graph at most once.
    composed_of:
    - one_to_one_function
    - graph_of_function
    tier: 3
    source_domain: calculus_ch01
  inverse_function:
    defines: For a one-to-one function f, the function f^-1 satisfying f^-1(f(x))
      = x and f(f^-1(y)) = y.
    composed_of:
    - one_to_one_function
    tier: 3
    source_domain: calculus_ch01
  restricted_domain:
    defines: A subset of a function's domain chosen so that the function becomes one-to-one
      and therefore invertible on that subset.
    composed_of:
    - one_to_one_function
    - domain_range
    tier: 3
    source_domain: calculus_ch01
  natural_exponential_function:
    defines: The exponential function f(x) = e^x, whose tangent line at x=0 has slope
      1.
    composed_of:
    - exponential_function
    - number_e
    tier: 3
    source_domain: calculus_ch01
  quadratic_formula:
    defines: The formula x = (-b ± sqrt(b^2-4ac)) / 2a used to find the zeros of a
      quadratic equation.
    composed_of:
    - quadratic_function
    tier: 4
    source_domain: calculus_ch01
  algebraic_function:
    defines: A function built from addition, subtraction, multiplication, division,
      rational powers, and roots.
    composed_of:
    - rational_function
    - root_function
    tier: 4
    source_domain: calculus_ch01
  sine_graph_transformations:
    defines: For f(x) = A sin(B(x-α)) + C, the parameters controlling amplitude, period,
      phase shift, and vertical shift.
    composed_of:
    - trigonometric_functions
    - period_of_function
    - function_transformations
    tier: 4
    source_domain: calculus_ch01
  inverse_trigonometric_functions:
    defines: Functions such as sin^-1, cos^-1, and tan^-1 defined by restricting the
      domain of each trigonometric function.
    composed_of:
    - trigonometric_functions
    - restricted_domain
    - inverse_function
    tier: 4
    source_domain: calculus_ch01
  logarithmic_function:
    defines: The inverse of the exponential function b^x, denoted log_b(x), satisfying
      log_b(x) = y if and only if b^y = x.
    composed_of:
    - exponential_function
    - inverse_function
    tier: 4
    source_domain: calculus_ch01
  hyperbolic_functions:
    defines: Functions such as sinh, cosh, and tanh defined as combinations of e^x
      and e^-x, satisfying cosh^2(x) - sinh^2(x) = 1.
    composed_of:
    - natural_exponential_function
    tier: 4
    source_domain: calculus_ch01
    also_in:
    - calculus_ch06
  natural_logarithm:
    defines: The logarithmic function with base e, denoted ln(x) = log_e(x), inverse
      to the natural exponential function.
    composed_of:
    - logarithmic_function
    - natural_exponential_function
    tier: 5
    source_domain: calculus_ch01
  change_of_base_formula:
    defines: Formulas allowing an exponential or logarithmic expression in one base
      to be rewritten in terms of another base, typically e.
    composed_of:
    - logarithmic_function
    - natural_logarithm
    tier: 6
    source_domain: calculus_ch01
  inverse_hyperbolic_functions:
    defines: The inverses of the hyperbolic functions, each expressible using the
      natural logarithm.
    composed_of:
    - hyperbolic_functions
    - natural_logarithm
    - inverse_function
    tier: 6
    source_domain: calculus_ch01
    also_in:
    - calculus_ch06
  secant_line:
    defines: The line through two points (a, f(a)) and (x, f(x)) on a function's graph,
      with slope msec = (f(x) - f(a))/(x - a).
    composed_of:
    - rate_of_change
    tier: 1
    source_domain: calculus_ch02
    also_in:
    - calculus_ch03
  average_velocity:
    defines: The change in an object's position divided by the length of the time
      interval over which the change occurred.
    composed_of:
    - rate_of_change
    tier: 1
    source_domain: calculus_ch02
  one_sided_limit:
    defines: The value that f(x) approaches as x approaches a from only the left or
      only the right side.
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  infinite_limit:
    defines: A description of a function's behavior in which f(x) increases or decreases
      without bound as x approaches a.
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  limit_laws:
    defines: A set of properties (sum, difference, constant multiple, product, quotient,
      power, root) that allow limits to be evaluated by combining limits of simpler
      functions.
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  epsilon_delta_definition_of_limit:
    defines: The formal definition stating that lim x→a f(x) = L if for every ε >
      0 there exists δ > 0 such that 0 < |x - a| < δ implies |f(x) - L| < ε.
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  continuity_at_a_point:
    defines: A function f(x) is continuous at a if f(a) is defined, lim x→a f(x) exists,
      and lim x→a f(x) = f(a).
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  area_problem:
    defines: The problem of determining the area between the graph of a function and
      the x-axis over an interval, approximated by summing the areas of thin rectangles.
    composed_of:
    - limit
    tier: 1
    source_domain: calculus_ch02
  tangent_line:
    defines: The line that secant lines through a point approach as the second point
      moves closer to the first, whose slope measures the instantaneous rate of change
      of the function at that point.
    composed_of:
    - secant_line
    - limit
    tier: 2
    source_domain: calculus_ch02
    also_in:
    - calculus_ch03
    - calculus_ch04
  instantaneous_velocity:
    defines: The value that average velocities approach as the time interval used
      to compute them shrinks toward a single instant.
    composed_of:
    - average_velocity
    - limit
    tier: 2
    source_domain: calculus_ch02
  vertical_asymptote:
    defines: A line x = a that a function's graph approaches when the function has
      an infinite limit (one-sided or two-sided) at a.
    composed_of:
    - infinite_limit
    - one_sided_limit
    tier: 2
    source_domain: calculus_ch02
  limits_of_polynomial_and_rational_functions:
    defines: The result that for a polynomial p(x), lim x→a p(x) = p(a), and for a
      rational function p(x)/q(x), the limit equals p(a)/q(a) when q(a) ≠ 0.
    composed_of:
    - limit_laws
    tier: 2
    source_domain: calculus_ch02
  indeterminate_form_evaluation:
    defines: Techniques such as factoring, multiplying by a conjugate, or simplifying
      complex fractions used to evaluate limits with the indeterminate form 0/0.
    composed_of:
    - limit_laws
    tier: 2
    source_domain: calculus_ch02
  squeeze_theorem:
    defines: A theorem stating that if f(x) ≤ g(x) ≤ h(x) near a and f and h share
      a common limit L at a, then g(x) also has limit L at a.
    composed_of:
    - limit_laws
    tier: 2
    source_domain: calculus_ch02
  discontinuity_types:
    defines: Classification of points where a function fails to be continuous as removable,
      jump, or infinite discontinuities.
    composed_of:
    - continuity_at_a_point
    tier: 2
    source_domain: calculus_ch02
  continuity_over_an_interval:
    defines: A function is continuous over an interval if it is continuous at every
      point in the interval, using one-sided continuity at closed endpoints.
    composed_of:
    - continuity_at_a_point
    tier: 2
    source_domain: calculus_ch02
  composite_function_theorem:
    defines: A theorem stating that if f is continuous at L and lim x→a g(x) = L,
      then lim x→a f(g(x)) = f(L).
    composed_of:
    - continuity_at_a_point
    tier: 2
    source_domain: calculus_ch02
  derivative:
    defines: The slope of the tangent line to a function at a point a, denoted f'(a),
      representing the rate of change of the function at a.
    composed_of:
    - tangent_line
    tier: 3
    source_domain: calculus_ch02
    also_in:
    - calculus_ch04
  trigonometric_limits:
    defines: A set of foundational limits, including lim θ→0 sinθ = 0, lim θ→0 cosθ
      = 1, and lim θ→0 (sinθ)/θ = 1, established using the squeeze theorem.
    composed_of:
    - squeeze_theorem
    tier: 3
    source_domain: calculus_ch02
  derivative_at_a_point:
    defines: The value f'(a), defined as the limit of the difference quotient as x
      approaches a (or h approaches 0), equal to the slope of the tangent line at
      a.
    composed_of:
    - limit
    - difference_quotient
    tier: 1
    source_domain: calculus_ch03
  derivative_function:
    defines: The function f'(x) whose value at each x is the derivative of f at that
      point, defined via the limit of the difference quotient as h approaches 0.
    composed_of:
    - limit
    - difference_quotient
    tier: 1
    source_domain: calculus_ch03
  instantaneous_rate_of_change:
    defines: The derivative of a function at a value a, interpreted as the rate at
      which the function is changing at that exact point.
    composed_of:
    - derivative_at_a_point
    tier: 2
    source_domain: calculus_ch03
  differentiability:
    defines: A function is differentiable at a point if its derivative exists there;
      differentiability implies continuity but not conversely.
    composed_of:
    - derivative_function
    - continuity
    tier: 2
    source_domain: calculus_ch03
  higher_order_derivatives:
    defines: Derivatives obtained by repeatedly differentiating a function, such as
      the second derivative (e.g., acceleration) and beyond.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  constant_rule:
    defines: The derivative of a constant function is zero.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  power_rule:
    defines: The derivative of x^n is n·x^(n-1), used to differentiate power functions
      without the limit definition.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  sum_difference_rule:
    defines: The derivative of a sum or difference of functions is the sum or difference
      of their derivatives.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  constant_multiple_rule:
    defines: The derivative of a constant times a function equals the constant times
      the function's derivative.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  product_rule:
    defines: The derivative of a product of two functions equals the derivative of
      the first times the second plus the derivative of the second times the first.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  quotient_rule:
    defines: The derivative of a quotient of two functions, expressed in terms of
      the derivatives and values of the numerator and denominator functions, divided
      by the square of the denominator.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  amount_of_change_formula:
    defines: An approximation f(a+h) ≈ f(a) + f'(a)h used to estimate a function's
      value from a known value and its derivative.
    composed_of:
    - derivative_at_a_point
    tier: 2
    source_domain: calculus_ch03
  derivatives_of_trig_functions:
    defines: Formulas for the derivatives of sine, cosine, tangent, cotangent, secant,
      and cosecant, derived from the limit definition and trigonometric identities.
    composed_of:
    - limit
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  chain_rule:
    defines: The derivative of a composite function h(x)=f(g(x)) equals f'(g(x))·g'(x),
      the derivative of the outer function times the derivative of the inner function.
    composed_of:
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
    also_in:
    - calculus_ch04
  derivative_of_exponential_function:
    defines: The derivative of e^x is e^x, and more generally the derivative of b^x
      involves b^x·ln(b), derived from limit assumptions on exponential functions.
    composed_of:
    - limit
    - derivative_function
    tier: 2
    source_domain: calculus_ch03
  power_rule_for_composition:
    defines: The chain rule applied to h(x) = (g(x))^n, giving h'(x) = n(g(x))^(n-1)g'(x).
    composed_of:
    - chain_rule
    - power_rule
    tier: 3
    source_domain: calculus_ch03
  inverse_function_theorem:
    defines: A formula relating the derivative of an invertible function's inverse
      to the derivative of the original function evaluated at the inverse.
    composed_of:
    - derivative_function
    - differentiability
    tier: 3
    source_domain: calculus_ch03
  implicit_differentiation:
    defines: A technique for finding dy/dx for a function y defined implicitly by
      an equation, by differentiating both sides with respect to x and solving for
      dy/dx.
    composed_of:
    - chain_rule
    - derivative_function
    tier: 3
    source_domain: calculus_ch03
  extended_power_rule:
    defines: The power rule extended to negative integer and rational exponents using
      the quotient rule and inverse function theorem.
    composed_of:
    - power_rule
    - quotient_rule
    - inverse_function_theorem
    tier: 4
    source_domain: calculus_ch03
  derivatives_of_inverse_trig_functions:
    defines: Formulas for the derivatives of inverse sine, cosine, tangent, cotangent,
      secant, and cosecant, derived using the inverse function theorem.
    composed_of:
    - inverse_function_theorem
    - derivatives_of_trig_functions
    tier: 4
    source_domain: calculus_ch03
  derivative_of_logarithmic_function:
    defines: The derivative of ln(x) is 1/x, obtained via implicit differentiation
      of its inverse relationship with e^x, extended to logarithms of other bases.
    composed_of:
    - implicit_differentiation
    - derivative_of_exponential_function
    tier: 4
    source_domain: calculus_ch03
  logarithmic_differentiation:
    defines: A technique for differentiating functions of the form g(x)^f(x) or complex
      products/quotients by taking the natural logarithm of both sides before differentiating.
    composed_of:
    - derivative_of_logarithmic_function
    - chain_rule
    tier: 5
    source_domain: calculus_ch03
  related_rates:
    defines: A technique for finding the rate of change of one quantity by relating
      it, via the chain rule, to another quantity's rate of change.
    composed_of:
    - derivative
    - chain_rule
    tier: 1
    source_domain: calculus_ch04
  linear_approximation:
    defines: Using the tangent line to approximate a function's values near a point.
    composed_of:
    - tangent_line
    tier: 1
    source_domain: calculus_ch04
  differentials:
    defines: The quantities dx and dy = f'(x)dx that approximate actual change in
      a function's output.
    composed_of:
    - derivative
    tier: 1
    source_domain: calculus_ch04
  extreme_value_theorem:
    defines: A continuous function on a closed, bounded interval attains both an absolute
      maximum and minimum.
    composed_of:
    - absolute_extrema
    tier: 1
    source_domain: calculus_ch04
  local_extrema:
    defines: A local maximum or minimum, where a function's value exceeds or is exceeded
      by all nearby values.
    composed_of:
    - absolute_extrema
    tier: 1
    source_domain: calculus_ch04
  critical_point:
    defines: An interior point where the derivative is zero or undefined; the only
      candidates for local extrema.
    composed_of:
    - derivative
    tier: 1
    source_domain: calculus_ch04
  concavity:
    defines: Whether a function's graph curves upward or downward, determined by the
      sign of the second derivative.
    composed_of:
    - derivative
    tier: 1
    source_domain: calculus_ch04
  horizontal_asymptote:
    defines: A horizontal line that a function's graph approaches as x approaches
      infinity or negative infinity.
    composed_of:
    - limits_at_infinity
    tier: 1
    source_domain: calculus_ch04
  infinite_limit_at_infinity:
    defines: The behavior of a function whose values grow arbitrarily large as the
      input approaches infinity.
    composed_of:
    - limits_at_infinity
    tier: 1
    source_domain: calculus_ch04
  indeterminate_forms:
    defines: Expressions such as 0/0 or infinity/infinity that require further analysis
      to resolve limits.
    composed_of:
    - limits_at_infinity
    tier: 1
    source_domain: calculus_ch04
  antiderivative:
    defines: A function F whose derivative equals a given function f.
    composed_of:
    - derivative
    tier: 1
    source_domain: calculus_ch04
    also_in:
    - calculus_ch05
  newtons_method:
    defines: An iterative technique for approximating roots using tangent lines.
    composed_of:
    - tangent_line
    - iterative_process
    tier: 1
    source_domain: calculus_ch04
  fermats_theorem:
    defines: If a differentiable function has a local extremum at c, then f'(c) =
      0.
    composed_of:
    - local_extrema
    - critical_point
    tier: 2
    source_domain: calculus_ch04
  second_derivative_test:
    defines: Classifying a critical point as a local max or min based on the sign
      of the second derivative.
    composed_of:
    - critical_point
    - concavity
    tier: 2
    source_domain: calculus_ch04
  oblique_asymptote:
    defines: A non-horizontal line that a rational function's graph approaches as
      x approaches infinity.
    composed_of:
    - limits_at_infinity
    - end_behavior
    tier: 2
    source_domain: calculus_ch04
  lhopitals_rule:
    defines: For indeterminate forms 0/0 or infinity/infinity, the limit of a quotient
      equals the limit of the quotient of derivatives.
    composed_of:
    - indeterminate_forms
    - derivative
    tier: 2
    source_domain: calculus_ch04
  indefinite_integral:
    defines: The notation representing the most general antiderivative of a function.
    composed_of:
    - antiderivative
    tier: 2
    source_domain: calculus_ch04
  power_rule_integrals:
    defines: The rule for integrating x^n, derived from the power rule for derivatives.
    composed_of:
    - antiderivative
    tier: 2
    source_domain: calculus_ch04
  rolles_theorem:
    defines: If f is continuous on [a,b], differentiable on (a,b), and f(a) = f(b),
      there exists c where f'(c) = 0.
    composed_of:
    - fermats_theorem
    - extreme_value_theorem
    tier: 3
    source_domain: calculus_ch04
  mean_value_theorem:
    defines: There exists a point where the instantaneous rate of change equals the
      average rate of change over an interval.
    composed_of:
    - rolles_theorem
    tier: 4
    source_domain: calculus_ch04
  mvt_corollaries:
    defines: Results from the Mean Value Theorem relating a function's derivative
      to its monotonicity and constancy.
    composed_of:
    - mean_value_theorem
    tier: 5
    source_domain: calculus_ch04
  first_derivative_test:
    defines: Classifying a critical point using the sign change of the first derivative
      around it.
    composed_of:
    - critical_point
    - mvt_corollaries
    tier: 6
    source_domain: calculus_ch04
  left_endpoint_approximation:
    defines: An estimate of the area under a curve formed by summing the areas of
      rectangles whose heights equal the function value at the left endpoint of each
      subinterval.
    composed_of:
    - sigma_notation
    - partition
    tier: 1
    source_domain: calculus_ch05
  right_endpoint_approximation:
    defines: An estimate of the area under a curve formed by summing the areas of
      rectangles whose heights equal the function value at the right endpoint of each
      subinterval.
    composed_of:
    - sigma_notation
    - partition
    tier: 1
    source_domain: calculus_ch05
  riemann_sum:
    defines: A sum of the form Σ f(x_i*)Δx approximating the area under a curve by
      evaluating the function at an arbitrary point in each subinterval of a partition.
    composed_of:
    - sigma_notation
    - partition
    tier: 1
    source_domain: calculus_ch05
  upper_lower_sums:
    defines: Riemann sums formed by choosing the maximum (upper sum) or minimum (lower
      sum) function value on each subinterval, giving guaranteed overestimates or
      underestimates of the area.
    composed_of:
    - riemann_sum
    tier: 2
    source_domain: calculus_ch05
  area_under_curve_limit:
    defines: The exact area under a curve is defined as the limit of a Riemann sum
      as the number of subintervals n approaches infinity.
    composed_of:
    - riemann_sum
    tier: 2
    source_domain: calculus_ch05
  definite_integral:
    defines: The limit of a Riemann sum as n approaches infinity, written ∫ from a
      to b of f(x)dx, generalizing the area under a curve to functions that may be
      negative or discontinuous.
    composed_of:
    - area_under_curve_limit
    tier: 3
    source_domain: calculus_ch05
    also_in:
    - calculus_ch06
  integrable_function:
    defines: A function for which the limit defining the definite integral exists;
      continuous functions on a closed interval are always integrable.
    composed_of:
    - definite_integral
    tier: 4
    source_domain: calculus_ch05
  net_signed_area:
    defines: The value of a definite integral interpreted as the area above the x-axis
      minus the area below the x-axis over the interval of integration.
    composed_of:
    - definite_integral
    tier: 4
    source_domain: calculus_ch05
  total_area:
    defines: The area between a function and the x-axis found by integrating the absolute
      value of the function, adding rather than subtracting area below the axis.
    composed_of:
    - net_signed_area
    tier: 5
    source_domain: calculus_ch05
  properties_of_definite_integrals:
    defines: Rules governing definite integrals, including behavior under reversed
      limits, sums/differences of functions, constant multiples, and splitting the
      interval of integration.
    composed_of:
    - definite_integral
    tier: 4
    source_domain: calculus_ch05
  comparison_theorem:
    defines: A theorem relating the relative sizes of definite integrals to the relative
      sizes of the integrands over the same interval.
    composed_of:
    - definite_integral
    tier: 4
    source_domain: calculus_ch05
  average_value_of_function:
    defines: The average value of a continuous function f over [a, b], computed as
      1/(b−a) times the definite integral of f over that interval.
    composed_of:
    - definite_integral
    tier: 4
    source_domain: calculus_ch05
  mean_value_theorem_integrals:
    defines: Guarantees that for a continuous function on [a, b], there exists a point
      c where f(c) equals the average value of the function on that interval.
    composed_of:
    - average_value_of_function
    tier: 5
    source_domain: calculus_ch05
  fundamental_theorem_calculus_part1:
    defines: States that if F(x) is defined as the definite integral of a continuous
      function f from a to x, then F is an antiderivative of f, i.e., F'(x) = f(x).
    composed_of:
    - definite_integral
    - antiderivative
    tier: 4
    source_domain: calculus_ch05
  fundamental_theorem_calculus_part2:
    defines: States that a definite integral of f over [a, b] can be evaluated as
      F(b) − F(a), where F is any antiderivative of f.
    composed_of:
    - fundamental_theorem_calculus_part1
    - antiderivative
    tier: 5
    source_domain: calculus_ch05
  net_change_theorem:
    defines: States that the new value of a quantity equals its initial value plus
      the integral of its rate of change over the interval.
    composed_of:
    - fundamental_theorem_calculus_part2
    tier: 6
    source_domain: calculus_ch05
  even_odd_function_integrals:
    defines: Rules stating that the integral of an even function over [−a, a] equals
      twice the integral over [0, a], while the integral of an odd function over [−a,
      a] equals zero.
    composed_of:
    - properties_of_definite_integrals
    tier: 5
    source_domain: calculus_ch05
  integration_by_substitution:
    defines: A technique for finding antiderivatives by substituting a variable u
      for an expression in the integrand, reversing the chain rule of differentiation.
    composed_of:
    - antiderivative
    tier: 1
    source_domain: calculus_ch05
  substitution_definite_integrals:
    defines: Applying u-substitution to a definite integral, including converting
      the limits of integration into the new variable u.
    composed_of:
    - integration_by_substitution
    - fundamental_theorem_calculus_part2
    tier: 6
    source_domain: calculus_ch05
  integrals_exponential_functions:
    defines: Formulas and substitution techniques for finding antiderivatives of exponential
      functions such as e^x and a^x.
    composed_of:
    - integration_by_substitution
    tier: 2
    source_domain: calculus_ch05
  integrals_logarithmic_functions:
    defines: Formulas and substitution techniques for integrating functions that produce
      natural or other-base logarithms, such as 1/x and ln(x).
    composed_of:
    - integration_by_substitution
    tier: 2
    source_domain: calculus_ch05
  integrals_inverse_trig_functions:
    defines: Integration formulas that yield inverse sine, tangent, and secant functions,
      derived from the derivatives of inverse trigonometric functions.
    composed_of:
    - antiderivative
    tier: 1
    source_domain: calculus_ch05
  area_between_curves:
    defines: The area of a region bounded by two curves, found by integrating the
      difference of the functions over an interval.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  volume_slicing_method:
    defines: A technique for finding the volume of a solid by integrating the cross-sectional
      area function over an interval.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  disk_method:
    defines: A special case of the slicing method for solids of revolution in which
      cross-sections are circular disks, giving volume as the integral of pi times
      the square of the radius function.
    composed_of:
    - volume_slicing_method
    - solid_of_revolution
    tier: 2
    source_domain: calculus_ch06
  washer_method:
    defines: A method for finding the volume of a solid of revolution with a cavity,
      where cross-sections are washers (annuli) formed by subtracting the area of
      an inner circle from an outer circle.
    composed_of:
    - disk_method
    tier: 3
    source_domain: calculus_ch06
  cylindrical_shell_method:
    defines: A technique for finding the volume of a solid of revolution by integrating
      the surface area of nested cylindrical shells, integrating along the axis perpendicular
      to the axis of revolution.
    composed_of:
    - solid_of_revolution
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  arc_length:
    defines: The length of a curve between two points, computed by integrating the
      square root of one plus the square of the derivative.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  surface_area_of_revolution:
    defines: The total area of the surface generated by revolving a curve around an
      axis, found by integrating 2*pi times the function times the arc length element.
    composed_of:
    - arc_length
    - solid_of_revolution
    tier: 2
    source_domain: calculus_ch06
  mass_from_density:
    defines: The mass of a one- or two-dimensional object found by integrating its
      linear or radial density function over its extent.
    composed_of:
    - linear_density
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  work_variable_force:
    defines: The energy expended moving an object along a line under a variable force,
      computed as the integral of the force function over distance.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  work_pumping_liquid:
    defines: The work required to move a liquid from one height to another, found
      by integrating the weight of thin horizontal layers times the distance each
      must be lifted.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  hydrostatic_force:
    defines: The total force exerted by a fluid on a submerged vertical surface, found
      by integrating pressure (weight-density times depth) times width over depth.
    composed_of:
    - definite_integral
    tier: 1
    source_domain: calculus_ch06
  centroid_lamina:
    defines: The geometric center of mass of a thin, flat plate (lamina) of constant
      density, found using integrals of the region's moments and area.
    composed_of:
    - moment
    - center_of_mass_point_masses
    - area_between_curves
    tier: 2
    source_domain: calculus_ch06
  symmetry_principle:
    defines: The principle that if a region is symmetric about a line, its centroid
      lies on that line.
    composed_of:
    - centroid_lamina
    tier: 3
    source_domain: calculus_ch06
  theorem_of_pappus:
    defines: The theorem that the volume of a solid of revolution equals the area
      of the revolved region multiplied by the distance traveled by its centroid.
    composed_of:
    - centroid_lamina
    - solid_of_revolution
    tier: 3
    source_domain: calculus_ch06
  number_e:
    defines: The unique real number for which the natural logarithm equals 1, used
      as the base of the natural exponential function.
    composed_of:
    - natural_logarithm_integral_def
    tier: 1
    source_domain: calculus_ch06
    also_in:
    - calculus_ch01
  exponential_function_def:
    defines: The function e^x defined as the inverse of the natural logarithm, extending
      exponentiation to all real exponents.
    composed_of:
    - natural_logarithm_integral_def
    tier: 1
    source_domain: calculus_ch06
  general_exponential_logarithm:
    defines: Exponential functions a^x and logarithms base a defined in terms of e^x
      and the natural logarithm for any positive base a.
    composed_of:
    - exponential_function_def
    - natural_logarithm_integral_def
    tier: 2
    source_domain: calculus_ch06
  doubling_time_half_life:
    defines: The constant time required for an exponentially growing quantity to double,
      or for an exponentially decaying quantity to reduce by half, given by (ln 2)/k.
    composed_of:
    - exponential_function_def
    tier: 2
    source_domain: calculus_ch06
  hyperbolic_derivatives_integrals:
    defines: Differentiation and integration rules for hyperbolic functions derived
      from their exponential definitions.
    composed_of:
    - hyperbolic_functions
    - exponential_function_def
    tier: 2
    source_domain: calculus_ch06
applications:
  mathematical_model:
    defines: A method of using mathematical equations, such as linear or quadratic
      functions fit to data, to simulate and predict real-life situations.
    needs:
    - linear_function
    - quadratic_function
    tier: 4
    source_domain: calculus_ch01
  compound_interest_application:
    defines: The application of the natural exponential function to model account
      balance growth under continuous compounding.
    needs:
    - natural_exponential_function
    tier: 4
    source_domain: calculus_ch01
  richter_scale_application:
    defines: A base-10 logarithmic scale comparing the relative intensity of earthquakes.
    needs:
    - logarithmic_function
    tier: 5
    source_domain: calculus_ch01
  integral_calculus:
    defines: The study of integrals, defined as limits of sums of rectangle areas,
      and their applications.
    needs:
    - area_problem
    tier: 2
    source_domain: calculus_ch02
  intermediate_value_theorem:
    defines: A theorem stating that if f is continuous on a closed interval [a, b],
      then f takes on every value between f(a) and f(b) at some point in [a, b].
    needs:
    - continuity_over_an_interval
    tier: 3
    source_domain: calculus_ch02
  differential_calculus:
    defines: The field of calculus concerned with the study of derivatives and their
      applications.
    needs:
    - derivative
    tier: 4
    source_domain: calculus_ch02
  multivariable_calculus:
    defines: The study of the calculus of functions of two or more variables, used
      for problems such as volumes and motion in three dimensions.
    needs:
    - derivative
    - integral_calculus
    tier: 4
    source_domain: calculus_ch02
  velocity:
    defines: The instantaneous rate of change of an object's position function, obtained
      by differentiating position with respect to time.
    needs:
    - instantaneous_rate_of_change
    tier: 3
    source_domain: calculus_ch03
  population_growth_rate:
    defines: The derivative of a population size function with respect to time, used
      to estimate future population values.
    needs:
    - instantaneous_rate_of_change
    tier: 3
    source_domain: calculus_ch03
  marginal_functions:
    defines: The derivatives of cost, revenue, and profit functions, approximating
      the change in each from producing or selling one additional item.
    needs:
    - amount_of_change_formula
    tier: 3
    source_domain: calculus_ch03
  acceleration:
    defines: The rate of change of velocity with respect to time, computed as the
      second derivative of the position function.
    needs:
    - velocity
    - higher_order_derivatives
    tier: 4
    source_domain: calculus_ch03
  propagated_error:
    defines: The error in a computed quantity resulting from a measurement error,
      estimated using differentials.
    needs:
    - differentials
    tier: 2
    source_domain: calculus_ch04
  locating_absolute_extrema:
    defines: A procedure for finding absolute extrema on a closed interval by comparing
      values at critical points and endpoints.
    needs:
    - critical_point
    - extreme_value_theorem
    - fermats_theorem
    tier: 3
    source_domain: calculus_ch04
  growth_rates:
    defines: A classification of how quickly functions grow relative to one another,
      determined using L'Hopital's rule.
    needs:
    - lhopitals_rule
    tier: 3
    source_domain: calculus_ch04
  initial_value_problem:
    defines: The problem of finding a function satisfying a differential equation
      and a specified initial condition.
    needs:
    - antiderivative
    - indefinite_integral
    tier: 3
    source_domain: calculus_ch04
  applied_optimization:
    defines: Real-world problems solved by expressing a quantity to be maximized or
      minimized as a function and finding its extrema.
    needs:
    - locating_absolute_extrema
    tier: 4
    source_domain: calculus_ch04
  curve_sketching:
    defines: A systematic procedure using limits, asymptotes, and derivatives to produce
      an accurate graph of a function.
    needs:
    - first_derivative_test
    - second_derivative_test
    - concavity
    - horizontal_asymptote
    - oblique_asymptote
    - end_behavior
    tier: 7
    source_domain: calculus_ch04
  displacement_from_velocity:
    defines: An application of the definite integral in which integrating a velocity
      function gives net displacement, and integrating its absolute value gives total
      distance traveled.
    needs:
    - definite_integral
    - net_change_theorem
    tier: 7
    source_domain: calculus_ch05
  price_demand_application:
    defines: Applications of integration to real-world rate problems such as recovering
      a price–demand function from its marginal function or modeling population/bacterial
      growth from a growth rate.
    needs:
    - net_change_theorem
    - integrals_exponential_functions
    tier: 7
    source_domain: calculus_ch05
  exponential_growth_model:
    defines: A model y = y0 e^(kt) describing systems, such as populations or investments,
      whose rate of growth is proportional to their current value.
    needs:
    - exponential_function_def
    tier: 2
    source_domain: calculus_ch06
  exponential_decay_model:
    defines: A model y = y0 e^(-kt) describing systems, such as radioactive substances
      or cooling objects, that decrease at a rate proportional to their current value.
    needs:
    - exponential_function_def
    tier: 2
    source_domain: calculus_ch06
  newtons_law_of_cooling:
    defines: The principle that an object's temperature changes at a rate proportional
      to the difference between its temperature and the ambient temperature, modeled
      with exponential decay.
    needs:
    - exponential_decay_model
    tier: 3
    source_domain: calculus_ch06
  catenary:
    defines: The curve, of the form y = a cosh(x/a), formed by a cable or chain hanging
      under its own weight between two supports.
    needs:
    - hyperbolic_functions
    tier: 1
    source_domain: calculus_ch06
